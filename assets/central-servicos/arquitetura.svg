<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura da Central de Serviços de TI</title>
  <desc id="desc">Fluxo do navegador pelo Apache e Spring Boot até SQL Server, anexos e logs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#101b2e"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity=".55"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/></marker>
    <style>
      .title{font:700 32px Arial,sans-serif;fill:#e8f0ff}.sub{font:16px Arial,sans-serif;fill:#91a4c2}.label{font:700 19px Arial,sans-serif;fill:#e8f0ff}.small{font:14px Arial,sans-serif;fill:#91a4c2}.mono{font:13px monospace;fill:#60a5fa}.box{fill:#111c2e;stroke:#274368;stroke-width:2}.soft{fill:#0d1727;stroke:#1e3554;stroke-width:2}.line{fill:none;stroke:#60a5fa;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <text x="64" y="72" class="title">Arquitetura de implantação</text>
  <text x="64" y="103" class="sub">Central de Serviços de TI · monólito modular · visão pública sem dados de ambiente</text>

  <g filter="url(#shadow)">
    <rect x="62" y="224" width="190" height="138" rx="18" class="box"/>
    <circle cx="112" cy="273" r="24" fill="url(#accent)"/>
    <path d="M101 273h22M112 262v22" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="92" y="323" class="label">Navegador</text>
    <text x="92" y="348" class="small">Equipe e portal público</text>

    <rect x="326" y="224" width="190" height="138" rx="18" class="box"/>
    <text x="356" y="278" class="mono">ENTRADA HTTP</text>
    <text x="356" y="314" class="label">Apache</text>
    <text x="356" y="340" class="small">proxy e headers</text>

    <rect x="590" y="170" width="284" height="246" rx="20" class="box"/>
    <rect x="590" y="170" width="284" height="8" rx="4" fill="url(#accent)"/>
    <text x="622" y="221" class="mono">APLICAÇÃO</text>
    <text x="622" y="258" class="label">Spring Boot</text>
    <text x="622" y="287" class="small">Security · MVC · Thymeleaf</text>
    <rect x="622" y="315" width="220" height="68" rx="12" class="soft"/>
    <text x="642" y="343" class="small">Controllers → Services</text>
    <text x="642" y="368" class="small">Repositories → JPA</text>

    <rect x="950" y="110" width="190" height="116" rx="18" class="box"/>
    <text x="980" y="153" class="mono">DADOS</text>
    <text x="980" y="187" class="label">SQL Server</text>
    <text x="980" y="211" class="small">Flyway · transações</text>

    <rect x="950" y="282" width="190" height="116" rx="18" class="box"/>
    <text x="980" y="325" class="mono">ARQUIVOS</text>
    <text x="980" y="359" class="label">Anexos</text>
    <text x="980" y="383" class="small">volume privado</text>

    <rect x="950" y="454" width="190" height="116" rx="18" class="box"/>
    <text x="980" y="497" class="mono">OPERAÇÃO</text>
    <text x="980" y="531" class="label">Logs e health</text>
    <text x="980" y="555" class="small">diagnóstico e backup</text>
  </g>

  <path d="M252 293H326" class="line"/>
  <path d="M516 293H590" class="line"/>
  <path d="M874 250C916 250 914 168 950 168" class="line"/>
  <path d="M874 293H950" class="line"/>
  <path d="M874 347C914 347 916 512 950 512" class="line"/>

  <rect x="64" y="505" width="810" height="96" rx="16" class="soft"/>
  <text x="92" y="542" class="label">Separação operacional</text>
  <text x="92" y="572" class="small">Apache e aplicação compartilham a rede de entrada; aplicação e banco usam uma rede privada separada.</text>
</svg>
